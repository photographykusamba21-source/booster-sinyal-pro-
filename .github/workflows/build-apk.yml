
name: Build BOOSTER SINYAL PRO Standard APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'BOOSTER_SINYAL_PRO_STANDARD_v4_source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract v4 source
        run: |
          set -e
          unzip -q BOOSTER_SINYAL_PRO_STANDARD_v4_source.zip -d project
          test -f project/app/build.gradle
          test -f project/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BOOSTER-SINYAL-PRO-standard-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
