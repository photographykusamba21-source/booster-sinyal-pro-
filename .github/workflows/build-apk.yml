
name: Build BOOSTER SINYAL PRO Standard APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'BOOSTER_SINYAL_PRO_STANDARD_v4_source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract v4 source
        id: extract
        shell: bash
        run: |
          set -e
          unzip -q BOOSTER_SINYAL_PRO_STANDARD_v4_source.zip -d project
          PROJECT_DIR="$(find project -type f -name settings.gradle -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        shell: bash
        run: |
          cd "${{ steps.extract.outputs.project_dir }}"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BOOSTER-SINYAL-PRO-standard-debug-apk
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
