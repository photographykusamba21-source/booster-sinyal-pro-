
name: Build BOOSTER SINYAL PRO APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'BOOSTER_SINYAL_PRO_source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          unzip -q BOOSTER_SINYAL_PRO_source.zip -d unpacked
          test -f unpacked/BOOSTER_SINYAL_PRO/app/build.gradle
          test -f unpacked/BOOSTER_SINYAL_PRO/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          cd unpacked/BOOSTER_SINYAL_PRO
          gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOOSTER-SINYAL-PRO-debug-apk
          path: unpacked/BOOSTER_SINYAL_PRO/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
